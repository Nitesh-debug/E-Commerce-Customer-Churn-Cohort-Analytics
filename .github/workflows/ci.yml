name: Python CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m py_compile app.py campaign_db.py feature_engineering.py generate_dashboard.py test_api.py test_pipeline.py
      - name: Run tests
        run: python -m unittest test_api.py test_pipeline.py
